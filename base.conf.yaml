- defaults:
    link:
      create: true
      relink: true
      relative: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ['~']

- create:
    - ~/.config/nvim
    - ~/.vim/autoload
    - ~/.vim/bundle

- link:
    ~/.tmux.conf: base/.tmux.conf
    ~/.gitconfig: base/.gitconfig
    ~/.vimrc: base/.vimrc
    ~/.zshrc: base/.zshrc
    ~/.config/nvim/init.vim: base/init.vim
    ~/.editrc: base/.editrc
    ~/init_work.sh: base/init_work.sh
    ~/.gnupg/gpg-agent.conf: base/gpg-agent.conf

- shell:
  - [curl -LSso ~/.vim/autoload/pathogen.vim https://tpo.pe/pathogen.vim]
  - [test -d ~/.oh-my-zsh || /bin/sh -c "$(curl -fsSL https://raw.github.com/robbyrussell/oh-my-zsh/master/tools/install.sh)"]
  - [command -v brew >/dev/null 2>&1 || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"]
  - [zstyle ':omz:update' mode auto]
  - [zstyle ':omz:update' frequency 1]
  - [zstyle ':omz:update' verbose silent]
  - [zsh -ic 'source ~/.zshrc; DISABLE_UPDATE_PROMPT=true omz update']
  - [exit]
  - [brew tap hashicorp/tap]
  - [brew update]
  - [brew upgrade -y]
  - [brew install -y terraform-linters/tap/tflint]
  - [brew install -y bgpdump bgpkit/tap/monocle bgpq4 git jq mtr pre-commit python@3.14 rust shellcheck shfmt socat tcpdump telnet hashicorp/tap/terraform docker docker-compose colima tmux vim wget rust okta-aws-cli vault kubectl sipcalc ipcalc rustup rustfmt rust-analyzer gpg awscli aws/tap/lightsailctl djlint stats bartender go aws/tap/lightsailctl djlint stats bartender clang-format neovim redis cloc claude-code]
  - [mkdir -p ~/.docker/cli-plugins]
  - [ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose]
#  - [colima start]
#  - [docker context use colima]
  - [echo $SHELL | grep -q "/bin/zsh" || chsh -s /bin/zsh]
  - [hash -r]
