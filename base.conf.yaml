- defaults:
    link:
      create: true
      relink: true
      relative: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ['~']

- create:
    - ~/.config/nvim
    - ~/.vim/autoload
    - ~/.vim/bundle

- link:
    ~/.tmux.conf: base/.tmux.conf
    ~/.gitconfig: base/.gitconfig
    ~/.vimrc: base/.vimrc
    ~/.zshrc: base/.zshrc
    ~/.config/nvim/init.vim: base/init.vim
    ~/.editrc: base/.editrc
    ~/start_work: base/start_work
    ~/.gnupg/gpg-agent.conf: base/gpg-agent.conf
    ~/.claude/settings.json: base/settings.json
    ~/.config/zed/settings.json: base/zed-settings.json
    ~/.gemini/antigravity-cli/settings.json: base/agy-settings.json

- shell:
  - [curl -LSso ~/.vim/autoload/pathogen.vim https://tpo.pe/pathogen.vim]
  - [test -d ~/.oh-my-zsh || /bin/sh -c "$(curl -fsSL https://raw.github.com/robbyrussell/oh-my-zsh/master/tools/install.sh)"]
  - [command -v brew >/dev/null 2>&1 || /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"]
  - [zstyle ':omz:update' mode auto]
  - [zstyle ':omz:update' frequency 1]
  - [zstyle ':omz:update' verbose silent]
  - [zsh -ic 'source ~/.zshrc; DISABLE_UPDATE_PROMPT=true omz update']
  - [exit]
  - [brew tap hashicorp/tap]
  - [brew update]
  - [brew upgrade -y]
  - [brew install -y awscli bgpdump bgpkit/tap/monocle bgpq4 can1357/tap/omp clang-format claude-code@latest cloc colima djlint docker docker-compose gh git glab go gpg hashicorp/tap/terraform ipcalc jq kubectl mtr okta-aws-cli pre-commit python@3.15 redis rust rust-analyzer rustup shellcheck shfmt sipcalc socat stats tcpdump telnet terraform-linters/tap/tflint tmux tree vault vim watch websocat wget yamllint yq]
  - [brew install --cask antigravity-cli codex gcloud-cli]
  # agy installs scapegoat from Claude Code's clone, so make sure Claude has it first.
  # Only when the clone is missing: "marketplace add" strips autoUpdate from settings.json.
  - [test -d ~/.claude/plugins/marketplaces/scapegoat || claude plugin marketplace add kiraum/scapegoat]
  - [claude plugin install scapegoat@scapegoat]
  - [agy plugin install ~/.claude/plugins/marketplaces/scapegoat]
  - [mkdir -p ~/.docker/cli-plugins]
  - [ln -sfn "$(brew --prefix)/opt/docker-compose/bin/docker-compose" ~/.docker/cli-plugins/docker-compose]
#  - [colima start]
#  - [docker context use colima]
  - [echo $SHELL | grep -q "/bin/zsh" || chsh -s /bin/zsh]
  - [hash -r]
